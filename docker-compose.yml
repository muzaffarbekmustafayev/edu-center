version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edu_center_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: edu_center
      TZ: Asia/Tashkent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edu_internal_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edu_center_server
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-secure_password}@postgres:5432/edu_center?schema=public"
      JWT_SECRET: ${JWT_SECRET:-edu_center_super_secret_jwt_access_key_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-edu_center_super_secret_jwt_refresh_key_min_32_chars}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-api-secret-key-123456789}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-demo_token}
      TZ: Asia/Tashkent
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3002,https://educenter.uz,https://admin.educenter.uz"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - edu_internal_net
      - edu_public_net

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: edu_center_bot
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-demo_token}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET_TOKEN: ${WEBHOOK_SECRET_TOKEN:-telegram-webhook-secret-token}
      SERVER_API_URL: "http://server:3000"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-api-secret-key-123456789}
      TZ: Asia/Tashkent
    ports:
      - "3001:3001"
    depends_on:
      - server
    networks:
      - edu_internal_net
      - edu_public_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edu_center_client
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3002:3002"
    networks:
      - edu_public_net

networks:
  edu_internal_net:
    internal: true
  edu_public_net:
    driver: bridge

volumes:
  postgres_data:
